<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Your Email - ArcticMKT</title>
<link rel="icon" href="Assests/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #132A3A;
    --ink-soft: #4C6572;
    --bg: #F5F9FA;
    --panel: #FFFFFF;
    --accent: #2E6F80;
    --accent-deep: #163B47;
    --line: #DCE6E9;
    --chip: #E7F1F2;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Work Sans', sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 44px 40px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: "";
    position: absolute;
    top: -50px;
    left: -50px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(46,111,128,0.08), transparent 70%);
  }

  .icon-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--chip);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 22px;
    position: relative;
  }

  .icon-circle svg {
    width: 24px;
    height: 24px;
    stroke: var(--accent-deep);
  }

  .brand-mark {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--accent-deep);
    margin-bottom: 16px;
    position: relative;
  }

  h2 {
    font-family: 'Source Serif 4', serif;
    font-weight: 500;
    font-size: 1.6rem;
    margin: 0 0 10px;
    position: relative;
  }

  .card > p {
    color: var(--ink-soft);
    font-size: 0.92rem;
    line-height: 1.6;
    margin: 0 0 8px;
    position: relative;
  }

  .card > p.target {
    color: var(--ink);
    font-weight: 500;
    margin-bottom: 28px;
  }

  .status-box {
    display: none;
    font-size: 0.85rem;
    padding: 11px 14px;
    border-radius: 5px;
    margin-bottom: 22px;
    line-height: 1.5;
    position: relative;
    text-align: left;
  }

  .status-error {
    background: #FBEAE3;
    color: #A6391A;
    border: 1px solid #F1C9B8;
  }

  .status-success {
    background: #E4F3EC;
    color: #1F6B4A;
    border: 1px solid #BFE3D2;
  }

  .status-info {
    background: var(--chip);
    color: var(--accent-deep);
    border: 1px solid #CBE0E3;
  }

  .submit-btn {
    width: 100%;
    padding: 13px 0;
    background: var(--accent-deep);
    color: #EAF3F4;
    border: none;
    border-radius: 5px;
    font-size: 0.95rem;
    font-weight: 500;
    font-family: 'Work Sans', sans-serif;
    cursor: pointer;
    transition: background 0.2s ease;
    position: relative;
    margin-bottom: 14px;
  }

  .submit-btn:hover { background: var(--accent); }

  .ghost-btn {
    width: 100%;
    padding: 13px 0;
    background: #fff;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 5px;
    font-size: 0.9rem;
    font-weight: 500;
    font-family: 'Work Sans', sans-serif;
    cursor: pointer;
    transition: background 0.2s ease;
    position: relative;
  }

  .ghost-btn:hover { background: var(--chip); }
  .ghost-btn[disabled-look="true"] { color: #A9BAC1; pointer-events: none; }

  .back-link {
    display: block;
    text-align: center;
    margin-top: 22px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-decoration: none;
    position: relative;
  }

  .back-link span { color: var(--accent-deep); font-weight: 500; }
  .back-link:hover span { text-decoration: underline; }

  .spinner {
    display: inline-block;
    width: 13px;
    height: 13px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 8px;
    vertical-align: -2px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 460px) {
    .card { padding: 36px 24px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="brand-mark">ArcticMKT</div>
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M3 7l9 6 9-6"></path>
      </svg>
    </div>
    <h2>Verify your email</h2>
    <p>We've sent a verification link to</p>
    <p class="target" id="targetEmail">your inbox</p>

    <div id="statusBox" class="status-box"></div>

    <button type="button" class="submit-btn" id="checkBtn">I've verified — continue</button>
    <button type="button" class="ghost-btn" id="resendBtn">Resend verification email</button>

    <a href="login.html" class="back-link">&larr; Back to <span>log in</span></a>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { onAuthStateChanged, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
    import { mapAuthError, showStatus, hideStatus } from "./authHelper.js";

    const statusBox = document.getElementById('statusBox');
    const targetEmail = document.getElementById('targetEmail');
    const checkBtn = document.getElementById('checkBtn');
    const resendBtn = document.getElementById('resendBtn');

    let pollTimer = null;
    let cooldownTimer = null;

    // Nobody signed in in this tab — nothing to verify, so send them back.
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'register.html';
        return;
      }

      targetEmail.textContent = user.email;

      if (user.emailVerified) {
        goToDashboard();
        return;
      }

      // Silently re-checks every few seconds so a person who verifies in another
      // tab gets moved along automatically, without needing to click "continue".
      pollTimer = setInterval(async () => {
        await user.reload();
        if (user.emailVerified) {
          clearInterval(pollTimer);
          goToDashboard();
        }
      }, 4000);
    });

    function goToDashboard() {
      showStatus(statusBox, 'Verified! Taking you to your dashboard…', 'success');
      sessionStorage.removeItem('pendingUid');
      sessionStorage.removeItem('pendingName');
      sessionStorage.removeItem('pendingEmail');
      sessionStorage.removeItem('pendingPhone');
      setTimeout(() => { window.location.href = './user/dashboard.html'; }, 600);
    }

    function startCooldown(seconds) {
      let remaining = seconds;
      resendBtn.setAttribute('disabled-look', 'true');
      resendBtn.textContent = `Resend available in ${remaining}s`;
      clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(cooldownTimer);
          resendBtn.removeAttribute('disabled-look');
          resendBtn.textContent = 'Resend verification email';
        } else {
          resendBtn.textContent = `Resend available in ${remaining}s`;
        }
      }, 1000);
    }

    checkBtn.addEventListener('click', async () => {
      hideStatus(statusBox);
      const user = auth.currentUser;
      if (!user) {
        window.location.href = 'register.html';
        return;
      }
      checkBtn.innerHTML = '<span class="spinner"></span>Checking…';
      checkBtn.disabled = true;
      try {
        await user.reload();
        if (user.emailVerified) {
          goToDashboard();
        } else {
          showStatus(statusBox, "We haven't seen a verification yet. Click the link in your email, then try again.", 'error');
        }
      } catch (err) {
        console.error(err);
        showStatus(statusBox, mapAuthError(err), 'error');
      } finally {
        checkBtn.textContent = "I've verified — continue";
        checkBtn.disabled = false;
      }
    });

    resendBtn.addEventListener('click', async () => {
      hideStatus(statusBox);
      const user = auth.currentUser;
      if (!user) return;
      try {
        await sendEmailVerification(user, { url: window.location.origin + '/login.html' });
        showStatus(statusBox, 'Verification email resent. Check your inbox (and spam folder).', 'info');
        startCooldown(30);
      } catch (err) {
        console.error(err);
        showStatus(statusBox, mapAuthError(err), 'error');
      }
    });
  </script>

</body>
</html>
